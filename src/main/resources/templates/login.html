<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - HostelSwap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{header :: nav}"></div>
<div th:replace="~{header :: flash}"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">&#8644;</span>HostelSwap</div>
    <h2>Welcome back</h2>
    <p class="muted">Log in with your @thapar.edu account.</p>
    <div style="height:18px;"></div>
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>
    <form th:action="@{/login}" method="post">
      <div class="form-group"><label>Thapar email</label>
        <input type="email" name="email" placeholder="yourname@thapar.edu" required></div>
      <div class="form-group"><label>Password</label>
        <input type="password" name="password" required></div>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="switch">New here? <a th:href="@{/register}">Create an account</a></p>
  </div>
</div>
</body>
</html>
