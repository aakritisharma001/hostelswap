spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hostelswap;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600
hostelswap.max-photo-mb=5
spring.servlet.multipart.max-file-size=${hostelswap.max-photo-mb}MB
spring.servlet.multipart.max-request-size=${hostelswap.max-photo-mb}MB
server.port=${PORT:8080}
# The first account registered with this email becomes the admin. Change to your own @thapar.edu email.
hostelswap.admin-email=asharma29_be24@thapar.edu
server.servlet.session.tracking-modes=cookie
spring.web.resources.cache.period=0