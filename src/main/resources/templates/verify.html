<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email - HostelSwap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{header :: nav}"></div>
<div th:replace="~{header :: flash}"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">&#8644;</span>HostelSwap</div>
    <h2>Check your email</h2>
    <p class="muted">We sent a 6-digit code to <strong th:text="${email}"></strong>.
      <span th:text="${purpose == 'REGISTER'} ? 'Enter it to finish creating your account.' : 'Enter it to log in.'"></span>
      The code expires in 10 minutes.</p>
    <div style="height:18px;"></div>
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>
    <form th:action="@{/verify}" method="post">
      <div class="form-group"><label>Verification code</label>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code" placeholder="6-digit code" required autofocus></div>
      <button type="submit" class="btn">Verify</button>
    </form>
    <form th:action="@{/verify/resend}" method="post" style="margin-top:12px;">
      <button type="submit" class="btn btn-outline btn-sm">Send a new code</button>
    </form>
    <p class="switch">Didn't get it? Check your spam folder, or <a th:href="@{/login}">start again</a>.</p>
  </div>
</div>
</body>
</html>
