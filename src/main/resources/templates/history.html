<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - HostelSwap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{header :: nav}"></div>
<div th:replace="~{header :: flash}"></div>
<div class="content">
  <h2 class="section-title">Transaction History</h2>
  <div th:each="s : ${sales}" class="row-card wrap">
    <div>
      <strong th:text="${s.item.title}"></strong>
      <div class="muted">&#8377;<span th:text="${s.finalPrice}"></span> &middot;
        <span th:text="${s.buyer.name}"></span> &rarr; <span th:text="${s.seller.name}"></span> &middot;
        <span th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy HH:mm')}"></span></div>
    </div>
    <span th:if="${ratedIds.contains(s.id)}" class="badge">Rated</span>
    <form th:unless="${ratedIds.contains(s.id)}" method="post" th:action="@{/rate}" class="inline">
      <input type="hidden" name="saleId" th:value="${s.id}">
      <select name="score">
        <option value="5">5 - Great</option><option value="4">4 - Good</option>
        <option value="3">3 - Okay</option><option value="2">2 - Poor</option><option value="1">1 - Bad</option>
      </select>
      <input type="text" name="comment" maxlength="255" placeholder="Comment (optional)">
      <button class="btn btn-sm">Rate</button>
    </form>
  </div>
  <div th:if="${sales.isEmpty()}" class="empty-card"><h3>No completed deals yet</h3><p class="muted">Deals appear here once a sale is completed.</p><a th:href="@{/dashboard}" class="btn">Browse the shop</a></div>
</div>
</body>
</html>
